name: Release

# Pull requests into main build the release files, to try before merging (the run's artifacts).
# A push to main (a merged pull request) whose version has no tag yet publishes them as a
# GitHub release, tagged v<version>. Bump the version with: node scripts/version.mjs <version>
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (node scripts/version.mjs).Trim()
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $tagged = [bool](git tag -l "v$v")
          "version=$v" >> $env:GITHUB_OUTPUT
          "tagged=$($tagged.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($tagged) { Write-Host "::notice::v$v is already released; this run builds the files without publishing. Bump the version to release." }
          else { Write-Host "Version $v has no release yet." }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: open-download-manager-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.tagged == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          ## Install

          **Windows 10 (2004) or later, 64-bit.**

          1. Download **OpenDownloadManager-$env:VERSION-setup-x64.exe** and run it. It installs for your user only, with no administrator rights. Prefer no installer? Unzip **OpenDownloadManager-$env:VERSION-portable-x64.zip** anywhere and run ``OpenDownloadManager.exe``.
          2. Start the app. Its welcome screen lists your browsers (Edge, Chrome, Brave, Vivaldi, Opera) with an **Add** button for each: it opens the browser's extensions page with the extension's folder beside it; turn on **Developer mode** and drag the folder onto the page. The installer's **Set up the browser extension** box opens it for you, and it is also in **Settings → Browsers**. The extension zips below are the same extension, to load by hand with **Load unpacked**.

          Windows SmartScreen may warn about the installer because it is not code-signed yet: choose **More info**, then **Run anyway**. ``SHA256SUMS.txt`` lists each file's checksum.

          "@
          # What's new in this version, when docs/release-notes/<version>.md has it.
          $whatsNew = "docs/release-notes/$env:VERSION.md"
          if (Test-Path $whatsNew) { $notes = (Get-Content $whatsNew -Raw -Encoding utf8) + "`n" + $notes }
          Set-Content release-notes.md $notes -Encoding utf8
          gh release create "v$env:VERSION" dist/release/* --target $env:GITHUB_SHA --title "Open Download Manager $env:VERSION" --notes-file release-notes.md --generate-notes
