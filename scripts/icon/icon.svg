      <stop offset="65%" stop-color="#2DD4BF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="globeSphere" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#BCE9F2" />
      <stop offset="32%" stop-color="#7EC8DC" />
      <stop offset="70%" stop-color="#4A9BC0" />
      <stop offset="100%" stop-color="#2D6E96" />
    </radialGradient>

    <radialGradient id="globeFresnel" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="91%" stop-color="#CFF5FC" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.52" />
    </radialGradient>

    <linearGradient id="globeTopSheen" x1="18%" y1="8%" x2="62%" y2="68%">
