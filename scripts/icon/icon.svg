    <linearGradient id="continentLayered" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62C8C2" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#297B94" stop-opacity="0.24" />
