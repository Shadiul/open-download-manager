      <g fill="url(#continentPrimary)">
        
        <path d="M 218 395 C 232 332 288 286 358 282 C 396 280 436 296 446 328 C 455 356 426 378 408 396 C 388 416 378 434 366 456 C 358 470 374 484 364 500 C 350 518 318 504 294 484 C 266 460 226 444 218 395 Z" />
        
        <path d="M 432 246 C 464 226 526 232 548 262 C 562 282 544 314 508 320 C 476 325 446 306 434 282 C 426 266 424 252 432 246 Z" />
        
        <path d="M 366 528 C 402 520 456 544 480 584 C 502 620 486 676 454 718 C 434 745 412 772 394 762 C 378 752 380 704 366 664 C 350 618 332 578 342 548 C 348 534 356 530 366 528 Z" />
        
        <path d="M 638 386 C 684 362 758 388 806 448 L 806 636 C 768 682 712 716 674 712 C 642 708 634 658 626 614 C 618 570 590 544 594 498 C 598 452 608 402 638 386 Z" />
        
        <ellipse cx="732" cy="656" rx="14" ry="31" transform="rotate(18 732 656)" />
        <ellipse cx="404" cy="488" rx="15" ry="7" transform="rotate(14 404 488)" />
