<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 66 880 880" width="1024" height="1024">
  <!-- The app icon (40 px and up). Framed tighter than its 1024 canvas so the tile fills a Windows
       icon like Fluent app icons do; icon-small.svg is drawn for 32 px and below. -->
  <defs>
    
    <linearGradient id="bgBase" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#F4FBFD" />
      <stop offset="48%" stop-color="#DEF2F7" />
      <stop offset="100%" stop-color="#BEE1EC" />
    </linearGradient>

    <radialGradient id="bgTopGlow" cx="24%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#E6F7FB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A7D6E6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bgBottomTint" cx="82%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#5DBAD0" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#5DBAD0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bgGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#76B5CA" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#4A8FA8" stop-opacity="0.42" />
    </linearGradient>

    <radialGradient id="ambientHalo" cx="50%" cy="52%" r="48%">
