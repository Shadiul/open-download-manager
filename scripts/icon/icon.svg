        <path d="M 382 552 C 412 550 452 574 464 608 C 474 636 456 680 430 706 C 414 722 396 684 384 646 C 370 604 364 554 382 552 Z" />
        <path d="M 656 420 C 696 408 748 432 778 476 L 778 602 C 744 642 702 668 678 662 C 656 656 650 612 642 574 C 634 532 622 432 656 420 Z" />
      </g>

      
      <circle cx="408" cy="392" r="222" fill="#FFFFFF" opacity="0.14" />
      <ellipse cx="425" cy="336" rx="176" ry="118" transform="rotate(-24 425 336)" fill="url(#globeTopSheen)" />

      
      <circle cx="512" cy="512" r="292" fill="url(#globeBounce)" />
      <circle cx="512" cy="512" r="292" fill="url(#globeFresnel)" />
    </g>

    
    <circle cx="512" cy="512" r="290.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" />
