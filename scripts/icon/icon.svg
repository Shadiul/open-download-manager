    <path d="M 294 714 C 344 748 472 722 598 634 C 690 568 758 486 766 430" fill="none" stroke="url(#orbitStroke)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
    
    <circle cx="308" cy="656" r="5" fill="#FFFFFF" opacity="0.72" />
    <circle cx="348" cy="698" r="3.5" fill="#B8F7F2" opacity="0.78" />
    <circle cx="722" cy="492" r="4" fill="#FFFFFF" opacity="0.65" />
  </g>

  
  <g transform="translate(578, 434) rotate(45)" filter="url(#rocketShadow)">
    
    <path d="M -22 142 C -26 196 -14 252 0 295 C 14 252 26 196 22 142 Z" fill="url(#plumeOuter)" filter="url(#softGlow)" />
    <path d="M -12 142 C -14 186 -7 228 0 254 C 7 228 14 186 12 142 Z" fill="url(#plumeCore)" />

    
    <path d="M -52 34 C -104 54 -124 104 -114 160 C -88 134 -64 120 -34 118 Z" fill="url(#finLeftLight)" />
    <path d="M -52 34 C -84 70 -96 108 -114 160 C -88 134 -64 120 -34 118 Z" fill="url(#finLeftShade)" opacity="0.45" />
    <path d="M -52 36 C -98 56 -118 100 -112 152" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    
    <path d="M 52 34 C 104 54 124 104 114 160 C 88 134 64 120 34 118 Z" fill="url(#finRightLight)" />
    <path d="M 52 34 C 84 70 96 108 114 160 C 88 134 64 120 34 118 Z" fill="url(#finRightShade)" opacity="0.55" />
    <path d="M 52 36 C 98 56 118 100 112 152" fill="none" stroke="#D2F4FA" stroke-width="2" stroke-linecap="round" opacity="0.45" />

    
    <path d="M -30 124 L 30 124 L 26 138 Q 0 144 -26 138 Z" fill="url(#collarGrad)" />
    <path d="M -24 134 L 24 134 L 30 154 Q 0 164 -30 154 Z" fill="url(#nozzleGrad)" />
    <ellipse cx="0" cy="154" rx="22" ry="5" fill="#164A66" opacity="0.7" />

    
    <path d="M 0 -192 C 44 -135 64 -56 57 48 C 53 89 43 116 34 132 L -34 132 C -43 116 -53 89 -57 48 C -64 -56 -44 -135 0 -192 Z" fill="url(#rocketHull)" />

    
    <g clip-path="url(#rocketHullClip)">
      
      <path d="M -60 -98 Q 0 -76 60 -98 L 68 -202 L -68 -202 Z" fill="url(#rocketNose)" />
      
      <path d="M -60 -98 Q 0 -76 60 -98" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.65" />
      <path d="M -60 -94 Q 0 -72 60 -94" fill="none" stroke="#0B5F80" stroke-width="2" opacity="0.24" />

      
      <path d="M -58 76 Q 0 92 58 76" fill="none" stroke="#4D8CA6" stroke-width="2" opacity="0.22" />
      <path d="M -58 79 Q 0 95 58 79" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.45" />

      
      <path d="M -10 -184 C -34 -128 -44 -48 -38 50 C -35 84 -28 112 -22 132 L -48 132 C -56 96 -62 40 -58 -48 C -52 -118 -34 -162 -10 -184 Z" fill="url(#rocketSpec)" />
      
      <path d="M -4 -180 C -22 -150 -32 -122 -36 -96" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />

      
      <path d="M 48 -110 C 58 -44 58 46 42 132 L 64 132 L 64 -110 Z" fill="#7FF2E2" opacity="0.22" />
