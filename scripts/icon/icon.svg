    <linearGradient id="orbitStroke" x1="10%" y1="85%" x2="88%" y2="18%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#D8F8FC" stop-opacity="0.55" />
