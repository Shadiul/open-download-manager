        <circle cx="-96" cy="-114" r="206" fill="#FFFFFF" opacity="0.12" />
        <circle cx="0" cy="0" r="276" fill="url(#v3_globe3DShade)" />
        <circle cx="0" cy="0" r="276" fill="url(#v3_globeFresnel)" />
      </g>
      <circle cx="0" cy="0" r="275" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.5" />
