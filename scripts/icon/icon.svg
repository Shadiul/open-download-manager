    </g>
    <path d="M 336 101.5 L 688 101.5 C 783 101.5, 839 101.5, 880.8 143.2 C 922.5 185, 922.5 241, 922.5 336 L 922.5 688 C 922.5 783, 922.5 839, 880.8 880.8 C 839 922.5, 783 922.5, 688 922.5 L 336 922.5 C 241 922.5, 185 922.5, 143.2 880.8 C 101.5 839, 101.5 783, 101.5 688 L 101.5 336 C 101.5 241, 101.5 185, 143.2 143.2 C 185 101.5, 241 101.5, 336 101.5 Z" fill="none" stroke="url(#v3_bgRim)" stroke-width="3" />
  </g>

  <g id="art" clip-path="url(#v3_sqClip)">
    
