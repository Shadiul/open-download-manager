      <circle cx="0" cy="0" r="26.5" fill="#176184" opacity="0.35" />
      
      <circle cx="0" cy="0" r="24.5" fill="url(#windowGlass)" />
      
      <path d="M -15 -9 A 17 17 0 0 1 8 -16" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.68" />
      <circle cx="-13" cy="2" r="2.6" fill="#FFFFFF" opacity="0.55" />
      <path d="M 14 11 A 17 17 0 0 1 -6 17" fill="none" stroke="#7FF2E2" stroke-width="2.5" stroke-linecap="round" opacity="0.42" />
