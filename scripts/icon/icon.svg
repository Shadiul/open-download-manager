      <path d="M 0 -182 C 42 -128 59 -54 53 46 C 49 86 39 112 31 126 L -31 126 C -39 112 -49 86 -53 46 C -59 -54 -42 -128 0 -182 Z" />
    </clipPath>
  </defs>

  
