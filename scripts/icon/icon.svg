    <filter id="rocketShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-8" dy="18" stdDeviation="16" flood-color="#0F3B54" flood-opacity="0.3" />
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
