  <!-- The rocket sits outside the tile's clip so its nose breaks out of the tile. -->
  <g transform="translate(512 512) scale(0.968) translate(-488 -528)">
    
    <g transform="translate(672, 486) rotate(50) scale(1.364) translate(0 146) scale(1.2) translate(0 -146)" filter="url(#v3_rocketShadow)">
