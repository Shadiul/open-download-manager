<svg xmlns="http://www.w3.org/2000/svg" viewBox="155 134 792 792" width="1024" height="1024">
  <!-- The app icon (40 px and up). The tile is drawn at 82% (the transforms on it and on v3_sqClip), so the
       globe and rocket stand large and the rocket breaks out of it; the frame is square and tight around
       everything drawn, nothing cut off and no padding (refit it if the artwork moves). render-icon.ps1 makes the 32 px and
       smaller sizes from it too: the group id="tile" is dropped and the frame fitted to what is left. -->
  <defs>
    
    <linearGradient id="v3_bgBase" x1="16%" y1="4%" x2="84%" y2="96%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="56%" stop-color="#F2F6FB" />
      <stop offset="100%" stop-color="#DCE6F2" />
    </linearGradient>
    <radialGradient id="v3_bgSoftTint" cx="76%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#FFE4E1" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#FFE4E1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="v3_bgRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.48" />
    </linearGradient>

    
    <radialGradient id="v3_globeOcean" cx="32%" cy="26%" r="76%">
      <stop offset="0%" stop-color="#5CD8FF" />
      <stop offset="38%" stop-color="#0A84FF" />
      <stop offset="76%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#002875" />
    </radialGradient>
    <radialGradient id="v3_globe3DShade" cx="28%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="72%" stop-color="#001952" stop-opacity="0.22" />
      <stop offset="92%" stop-color="#000E36" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#000721" stop-opacity="0.64" />
    </radialGradient>
    <radialGradient id="v3_globeFresnel" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="92%" stop-color="#7DD3FC" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.72" />
    </radialGradient>
    <linearGradient id="v3_land" x1="12%" y1="6%" x2="90%" y2="94%">
      <stop offset="0%" stop-color="#3FE89C" />
      <stop offset="52%" stop-color="#10BC83" />
      <stop offset="100%" stop-color="#047455" />
    </linearGradient>
    <linearGradient id="v3_landHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.04" />
    </linearGradient>

    
    <linearGradient id="v3_trailFront" x1="586" y1="558" x2="215" y2="738" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="16%" stop-color="#FF9F1C" stop-opacity="0.98" />
      <stop offset="42%" stop-color="#FF2D20" stop-opacity="0.92" />
      <stop offset="74%" stop-color="#0A84FF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.52" />
    </linearGradient>
    <linearGradient id="v3_trailCore" x1="586" y1="558" x2="232" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="28%" stop-color="#FFE066" stop-opacity="0.95" />
      <stop offset="62%" stop-color="#FF453A" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="v3_trailBack" x1="215" y1="738" x2="773" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.52" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="v3_hull" x1="0%" y1="15%" x2="100%" y2="28%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5FA" />
      <stop offset="76%" stop-color="#CBD9EA" />
      <stop offset="100%" stop-color="#94ACC8" />
    </linearGradient>
    <linearGradient id="v3_red" x1="10%" y1="8%" x2="90%" y2="88%">
      <stop offset="0%" stop-color="#FF6259" />
      <stop offset="46%" stop-color="#F01E24" />
      <stop offset="100%" stop-color="#A60A13" />
    </linearGradient>
    <linearGradient id="v3_finL" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#FF5B52" />
      <stop offset="100%" stop-color="#D4141D" />
    </linearGradient>
    <linearGradient id="v3_finS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD1018" />
      <stop offset="100%" stop-color="#73060D" />
    </linearGradient>
    <linearGradient id="v3_bezel" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="52%" stop-color="#D6E3F3" />
      <stop offset="100%" stop-color="#7E9CBF" />
    </linearGradient>
    <radialGradient id="v3_glass" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#75F2FF" />
      <stop offset="46%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#002A75" />
    </radialGradient>
    <linearGradient id="v3_nozzle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A8C2" />
      <stop offset="48%" stop-color="#516885" />
      <stop offset="100%" stop-color="#24364D" />
    </linearGradient>

    <filter id="v3_sqShadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1E293B" flood-opacity="0.18" />
    </filter>
    <filter id="v3_globeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.26" />
    </filter>
    <filter id="v3_trailGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="v3_rocketShadow" x="-32%" y="-32%" width="164%" height="164%">
      <feDropShadow dx="-8" dy="18" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.32" />
    </filter>

    <clipPath id="v3_sqClip">
      <path transform="translate(512 512) scale(0.82) translate(-512 -512)" d="M 336 100 L 688 100 C 784 100, 840 100, 882 142 C 924 184, 924 240, 924 336 L 924 688 C 924 784, 924 840, 882 882 C 840 924, 784 924, 688 924 L 336 924 C 240 924, 184 924, 142 882 C 100 840, 100 784, 100 688 L 100 336 C 100 240, 100 184, 142 142 C 184 100, 240 100, 336 100 Z" />
    </clipPath>
    <clipPath id="v3_globeClip"><circle cx="0" cy="0" r="276" /></clipPath>
