<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Open Download Manager</strong>
    <span id="host" class="status">Checking…</span>
  </header>
  <h2>Quick settings</h2>
  <label class="row toggle"><input type="checkbox" id="enabled"> Send browser downloads to the app</label>
  <label class="row toggle"><input type="checkbox" id="showVideoButton"> Show the "Download this video" button</label>
  <label class="row toggle" id="siteRow" hidden><input type="checkbox" id="siteOn"> Use on <span id="siteName"></span></label>
  <p class="muted small">Hold Alt while clicking a link to leave that download to the browser.</p>
  <h2>Media on this page</h2>
  <ul id="media"></ul>
  <p id="empty" class="muted" hidden>Nothing found yet. Start playing the video and reopen this window.</p>
  <p id="error" class="error" hidden></p>
  <footer><a href="#" id="options">All settings (file types, sizes, sites)</a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
