<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/32.png" alt="" width="20" height="20">
    <h1>Open Download Manager</h1>
    <span id="host" class="status" title="">Checking…</span>
    <button id="options" class="icon-button" title="Settings" aria-label="Settings">
      <svg viewBox="0 -960 960 960" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm112-260q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Z"/></svg>
    </button>
  </header>

  <main>
    <div class="section"><span>Videos on this page</span><span id="count"></span></div>
    <ul id="cards" role="list"></ul>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 -960 960 960" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="m380-300 280-180-280-180v360ZM160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm0-80h640v-480H160v480Z"/></svg>
      <p id="emptyTitle">No videos found yet</p>
      <p id="emptyText">Play a video, then open this again.</p>
    </div>
    <p id="error" class="error" hidden></p>
  </main>

  <footer>
    <label class="setting"><span>Send downloads to the app</span><span class="toggle"><input type="checkbox" id="enabled"><span class="track"></span><span class="knob"></span></span></label>
    <label class="setting"><span>Download button on videos</span><span class="toggle"><input type="checkbox" id="showVideoButton"><span class="track"></span><span class="knob"></span></span></label>
    <label class="setting" id="siteRow" hidden><span id="siteName"></span><span class="toggle"><input type="checkbox" id="siteOn"><span class="track"></span><span class="knob"></span></span></label>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
