<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Open Download Manager</strong>
    <span id="host" class="status">Checking…</span>
  </header>
  <label class="row toggle">
    <input type="checkbox" id="enabled"> Catch browser downloads
  </label>
  <h2>Media on this page</h2>
  <ul id="media"></ul>
  <p id="empty" class="muted" hidden>Nothing found yet. Start playing the video and reopen this window.</p>
  <p id="error" class="error" hidden></p>
  <footer><a href="#" id="options">Settings</a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
